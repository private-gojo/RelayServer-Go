name: Build and Publish X-Relay

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Validate and Compile Go Bridge
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" -o /tmp/x-relay-bridge ./relay-ssh

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@efd0ee061f5c49b633c212327f0606b915f2d212 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:v0.29.0

      - name: Build and push Docker image
        uses: docker/build-push-action@bcad3d87a83c2a42f50624f3c5c02c2572e5d200 # v7.1.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/x-relay:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/x-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
