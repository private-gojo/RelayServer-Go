; ============================================================
; GOJO X-RELAY — SUPERVISORD CONFIG (relay-utilities)
; ============================================================
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=/etc/x-relay/wait-for-bridge.sh
autostart=true
autorestart=true
stopwaitsecs=5
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

[program:dropbear]
command=/usr/local/sbin/dropbear -F -E -R -p 2224 -b /etc/x-relay/banner.txt -W 32768 -K 60 -I 900
autostart=true
autorestart=true
stopwaitsecs=5
stderr_logfile=/var/log/supervisor/dropbear.err.log
stdout_logfile=/var/log/supervisor/dropbear.out.log

[program:bridge]
command=/usr/local/bin/x-relay-bridge
autostart=true
autorestart=true
stopwaitsecs=15
stderr_logfile=/var/log/supervisor/bridge.err.log
stdout_logfile=/var/log/supervisor/bridge.out.log

[program:udpgw]
command=/usr/local/bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 1024 --udp-mtu 65520 --client-socket-sndbuf 1048576 --loglevel info --udp-idle-timeout 120
autostart=true
autorestart=true
stopwaitsecs=10
stderr_logfile=/var/log/supervisor/udpgw.err.log
stdout_logfile=/var/log/supervisor/udpgw.out.log
